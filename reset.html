<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeGoals – Extend Access</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
  :root{--bg:#0a0a0a;--card:#111;--border:#1e1e1e;--text:#f0f0f0;--muted:#666;--accent:#00e87a;--err:#ff3b3b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem;width:100%;max-width:360px;}
  h1{font-size:1.2rem;margin-bottom:1.2rem;}
  input{width:100%;padding:0.7rem;margin-bottom:0.8rem;background:#0d0d0d;border:1px solid var(--border);border-radius:8px;color:var(--text);}
  button{width:100%;padding:0.7rem;background:var(--accent);color:#000;font-weight:700;border:none;border-radius:8px;cursor:pointer;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:200;}
  .modal{position:relative;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:1.8rem;max-width:320px;text-align:center;}
  .modal.error{border-color:var(--err);}
  .modal h2{font-size:1rem;margin-bottom:0.6rem;}
  .modal p{color:var(--muted);font-size:0.85rem;}
  .modal-close{
    position:absolute;top:10px;right:12px;
    background:none;border:none;width:auto;padding:0;
    color:var(--muted);font-size:1.1rem;cursor:pointer;line-height:1;
  }
  .modal-close:hover{color:var(--text);}
</style>
</head>
<body>
<div class="card">
  <h1>Extend your access</h1>
  <form id="resetForm">
    <input id="username" placeholder="Username" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="currentPassword" type="password" placeholder="Current Password" required>
    <button type="submit">Extend</button>
  </form>
</div>

<div class="overlay" id="alertModal">
  <div class="modal" id="alertBox">
    <button class="modal-close" id="alertClose">&times;</button>
    <h2 id="alertTitle"></h2>
    <p id="alertText"></p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ccmsjcnuyrngqxwrswfe.supabase.co';
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjbXNqY251eXJuZ3F4d3Jzd2ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE2MjU2MjgsImV4cCI6MjA2NzIwMTYyOH0.dkjCo2bgDMf923VKESkyMLsULo7IhmsYb6r-4Dn6SRY";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Gate: only accessible via redirect from paid.html
(function gateAccess(){
  if (!document.referrer.includes('paid.html')) {
    window.location.href = 'https://paystack.shop/pay/o1lru4fygx';
  }
})();

function showAlert(success, text) {
  document.getElementById('alertTitle').textContent = success ? 'Success' : 'Error';
  document.getElementById('alertText').textContent = text;
  document.getElementById('alertBox').className = success ? 'modal' : 'modal error';
  document.getElementById('alertModal').style.display = 'flex';
}

document.getElementById('alertClose').addEventListener('click', () => {
  document.getElementById('alertModal').style.display = 'none';
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const currentPassword = document.getElementById('currentPassword').value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: currentPassword });
  if (error) { showAlert(false, error.message); return; }

  const { data: profile, error: profileErr } = await supabaseClient
    .from('profiles').select('username').eq('id', data.user.id).single();
  if (profileErr) { showAlert(false, profileErr.message); return; }
  if (profile.username !== username) { showAlert(false, 'Username does not match this account.'); return; }

  const newExpiry = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString();
  const { error: updateErr } = await supabaseClient.from('profiles')
    .update({ expires_at: newExpiry }).eq('id', data.user.id);
  if (updateErr) { showAlert(false, updateErr.message); return; }

  showAlert(true, 'Access extended by 30 days!');
  setTimeout(() => window.location.href = 'dashboard.html', 1500);
});
</script>
</body>
</html>
