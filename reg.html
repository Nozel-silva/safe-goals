<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="signup.css" />

</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="white" d="M21.362 9.354H12V14.6h5.338c-.276 1.38-1.1 2.537-2.345 3.32v2.75h3.79c2.216-2.04 3.495-5.046 3.495-8.643 0-.61-.06-1.208-.155-1.673Z"/>
        <path fill="white" d="M12 22c2.7 0 4.965-.895 6.62-2.43l-3.79-2.75c-.895.6-2.04.954-2.83.954-2.18 0-4.025-1.47-4.685-3.45H3.4v2.84C5.045 20.11 8.305 22 12 22Z"/>

        <path fill="white" d="M12 6.555c1.23 0 2.332.424 3.2 1.254l2.4-2.4C15.965 4.045 13.7 3 12 3 8.305 3 5.045 4.89 3.4 7.536l3.915 2.14C7.975 8.025 9.82 6.555 12 6.555Z"/>

    </div>

    <h1>Get started</h1>
    <p class="subtitle">Sign in or create an account in one tap</p>

    <div id="error-msg" class="error-box"></div>

    <button class="google-btn" onclick="handleGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>
<button class="thank-btn" onclick="handleThankYou()">Thank You</button>
    <p class="footer-text">By continuing, you agree to your project's terms of service.</p>
  </div>


<script src="auth.js"></script>
</body>
</html>
