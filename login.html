<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeGoals – Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
  :root{--bg:#0a0a0a;--card:#111;--border:#1e1e1e;--text:#f0f0f0;--muted:#666;--accent:#00e87a;--err:#ff3b3b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem;width:100%;max-width:360px;}
  h1{font-size:1.2rem;margin-bottom:1.2rem;}
  input{width:100%;padding:0.7rem;margin-bottom:0.8rem;background:#0d0d0d;border:1px solid var(--border);border-radius:8px;color:var(--text);}
  button{width:100%;padding:0.7rem;background:var(--accent);color:#000;font-weight:700;border:none;border-radius:8px;cursor:pointer;}
  #msg{margin-top:0.8rem;font-size:0.8rem;color:var(--err);}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:200;}
  .modal{background:var(--card);border:1px solid var(--err);border-radius:14px;padding:1.8rem;max-width:340px;text-align:center;}
  .modal h2{color:var(--err);font-size:1rem;margin-bottom:0.6rem;}
  .modal p{color:var(--muted);font-size:0.85rem;}
</style>
</head>
<body>
<div class="card">
  <h1>Login to SafeGoals</h1>
  <form id="loginForm">
    <input id="username" placeholder="Username" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <div id="msg"></div>
</div>

<div class="overlay" id="expiredModal">
  <div class="modal">
    <h2>Access Expired</h2>
    <p>Your password has expired. Redirecting you to renew access...</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ccmsjcnuyrngqxwrswfe.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjbXNqY251eXJuZ3F4d3Jzd2ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE2MjU2MjgsImV4cCI6MjA2NzIwMTYyOH0.dkjCo2bgDMf923VKESkyMLsULo7IhmsYb6r-4Dn6SRY';
  ';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';

  const { data: email, error: emailErr } = await supabaseClient.rpc('get_email_by_username', { uname: username });
  if (emailErr || !email) { msg.textContent = 'Invalid username or password'; return; }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { msg.textContent = 'Invalid username or password'; return; }

  const { data: profile, error: profileErr } = await supabaseClient
    .from('profiles').select('expires_at').eq('id', data.user.id).single();
  if (profileErr) { msg.textContent = 'Something went wrong. Try again.'; return; }

  if (new Date(profile.expires_at) < new Date()) {
    await supabaseClient.auth.signOut();
    document.getElementById('expiredModal').style.display = 'flex';
    setTimeout(() => window.location.href = 'paid.html', 1800);
    return;
  }

  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
