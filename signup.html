<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeGoals – Sign Up</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

  
<style>
  :root{--bg:#0a0a0a;--card:#111;--border:#1e1e1e;--text:#f0f0f0;--muted:#666;--accent:#00e87a;--err:#ff3b3b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem;width:100%;max-width:360px;}
  h1{font-size:1.2rem;margin-bottom:1.2rem;}
  input{width:100%;padding:0.7rem;margin-bottom:0.8rem;background:#0d0d0d;border:1px solid var(--border);border-radius:8px;color:var(--text);}
  button{width:100%;padding:0.7rem;background:var(--accent);color:#000;font-weight:700;border:none;border-radius:8px;cursor:pointer;}
  #msg{margin-top:0.8rem;font-size:0.8rem;color:var(--muted);}
</style>
</head>
<body>
<div class="card">
  <h1>Create your SafeGoals account</h1>
  <form id="signupForm">
    <input id="username" placeholder="Username" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password (min 6 chars)" minlength="6" required>
    <button type="submit">Sign Up</button>
  </form>
  <div id="msg"></div>
</div>

<script>
const SUPABASE_URL = "https://ccmsjcnuyrngqxwrswfe.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjbXNqY251eXJuZ3F4d3Jzd2ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE2MjU2MjgsImV4cCI6MjA2NzIwMTYyOH0.dkjCo2bgDMf923VKESkyMLsULo7IhmsYb6r-4Dn6SRY";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Gate: only accessible via redirect from pay.html
(function gateAccess(){
  if (!document.referrer.includes('pay.html')) {
    window.location.href = 'https://paystack.shop/pay/fqlm48nc1i';
  }
})();

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.style.color = 'var(--muted)';
  msg.textContent = 'Creating account...';

  const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password });
  if (signUpError) { msg.style.color = 'var(--err)'; msg.textContent = signUpError.message; return; }

  const userId = signUpData.user?.id;
  if (!userId) { msg.textContent = 'Check your email to confirm your account, then log in.'; return; }

  const expiresAt = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString();
  const { error: profileError } = await supabaseClient.from('profiles')
    .insert({ id: userId, username, email, expires_at: expiresAt });
  if (profileError) { msg.style.color = 'var(--err)'; msg.textContent = profileError.message; return; }

  msg.style.color = 'var(--accent)';
  msg.textContent = 'Account created! Redirecting...';
  setTimeout(() => window.location.href = 'dashboard.html', 1200);
});
</script>
</body>
</html>
