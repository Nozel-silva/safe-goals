<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeGoals - GSP & Submit Fixture</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px;
    }

    .page-wrap {
      width: 100%;
      max-width: 420px;
    }

    header {
      margin-bottom: 28px;
      text-align: left;
    }

    header .brand {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .gsp-section {
      margin-bottom: 32px;
    }

    .gsp-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }

    .team-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 18px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .team-card h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 2px;
    }

    .team-card label {
      font-size: 0.72rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .team-card input {
      padding: 9px 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
    }

    .team-card input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .team-card button {
      background-color: #3b82f6;
      color: #fff;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .team-card button:hover {
      background-color: #2563eb;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      padding: 6px 0;
      border-top: 1px solid #334155;
    }

    .stats-row span:first-child {
      color: #94a3b8;
    }

    .stats-row span:last-child {
      color: #f1f5f9;
      font-weight: 600;
    }

    #matchSummary {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* ---- Submission form ---- */
    form#fixture-form {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 20px 18px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    form#fixture-form input {
      padding: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    form#fixture-form input:focus {
      outline: none;
      border-color: #10b981;
    }

    form#fixture-form button {
      background-color: #10b981;
      color: #0f172a;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    form#fixture-form button:hover {
      background-color: #0ea975;
    }

    /* ---- Desktop view ---- */
    @media (min-width: 900px) {
      body {
        padding: 48px;
      }

      .page-wrap {
        max-width: 960px;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 32px;
        align-items: start;
      }

      header {
        grid-column: 1 / -1;
      }

      .gsp-section {
        grid-column: 1;
        margin-bottom: 0;
      }

      .gsp-container {
        flex-direction: row;
      }

      .team-card {
        flex: 1;
      }

      form#fixture-form {
        grid-column: 2;
        position: sticky;
        top: 48px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrap">
    <header>
      <div class="brand">SafeGoals</div>
      <h1>Fixture Risk Analysis</h1>
    </header>

    <!-- ===== GSP Calculator ===== -->
    <div class="gsp-section">
      <h2>GSP Calculator</h2>
      <div class="gsp-container">
        <div class="team-card">
          <h3>Home Team</h3>
          <label>Club Name</label>
          <input type="text" id="clubName1">

          <label for="homeGoals1">Total H2H Goals scored at Home side (prev 5)</label>
          <input type="number" id="homeGoals1" step="any" placeholder="e.g. 9">

          <label for="awayGoals1">Total H2H Goals scored Away (prev 5)</label>
          <input type="number" id="awayGoals1" step="any" placeholder="e.g. 6">

          <label for="form1Input">Form rating (0–100)</label>
          <input type="number" id="form1Input" step="any" min="0" max="100" placeholder="e.g. 70">

          <button type="button" onclick="calculateTeam('1')">Calculate</button>

          <div class="stats-row"><span>GSP</span><span id="gsp1">—</span></div>
          <div class="stats-row"><span>True GSP</span><span id="ar1">—</span></div>
        </div>

        <div class="team-card">
          <h3>Away Team</h3>
          <label>Club Name</label>
          <input type="text" id="clubName2">

          <label for="awayGoals2"> Total H2H Goals scored Away (prev 5)</label>
          <input type="number" id="awayGoals2" step="any" placeholder="e.g. 7">

          <label for="homeGoals2">Total H2H Goals scored at Home (prev 5)</label>
          <input type="number" id="homeGoals2" step="any" placeholder="e.g. 5">

          <label for="form2Input">Form rating (0–100)</label>
          <input type="number" id="form2Input" step="any" min="0" max="100" placeholder="e.g. 55">

          <button type="button" onclick="calculateTeam('2')">Calculate</button>

          <div class="stats-row"><span>GSP</span><span id="gsp2">—</span></div>
          <div class="stats-row"><span>True GSP</span><span id="ar2">—</span></div>
        </div>
      </div>

      <div id="matchSummary">
        Calculate both teams to see the comparison.
      </div>
    </div>

    <!-- ===== Submission Form (untouched logic) ===== -->
    <form id="fixture-form">
      <input type="text" id="homeName" placeholder="Home Team" required />
      <input type="text" id="awayName" placeholder="Away Team" required />
      <input type="number" id="homeGSP" step="any" placeholder="Home GSP" required />
      <input type="number" id="awayGSP" step="any" placeholder="Away GSP" required />
      <button type="submit">Save Fixture</button>
    </form>
  </div>

  <script src="upload.js"></script>
</body>
        </html>
